<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MileCount</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #102019;

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

      margin-bottom: 5px;

    }

    p {

    }

    .demo {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 15px;
      background: #fff0bf;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>

<body>

  <main class="hero">
    <div>
      <h1>MileCount<span class="green">.</span></h1>

      <p>

      </p>

        Find more money along your route.<br>

      </p>

      <div class="demo">
        SIMULATION — LOADS ARE NOT BOOKABLE
      </div>

</html>
