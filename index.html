<script>
(function () {
  "use strict";

  const screens = document.querySelectorAll(".screen");
  const navButtons = document.querySelectorAll("nav button");

  function showScreen(index) {
    screens.forEach(function (screen, i) {
      screen.classList.toggle("active", i === index);
    });

    navButtons.forEach(function (button, i) {
      button.classList.toggle("active", i === index);
    });

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  navButtons.forEach(function (button) {
    button.addEventListener("click", function () {
      const index = Number(button.dataset.screen);
      showScreen(index);
    });
  });

  function getNumber(id, fallback) {
    const element = document.getElementById(id);

    if (!element) {
      return fallback || 0;
    }

    const value = Number(element.value);

    if (!Number.isFinite(value)) {
      return fallback || 0;
    }

    return value;
  }

  function money(value) {
    return "$" + Math.round(value).toLocaleString();
  }

  /*
   * SIMULATION SETTINGS
   *
   * Later:
   * - MPG comes from Truck Profile
   * - diesel comes from EIA/public fuel data
   * - freight comes from authorized sources
   */

  const TRUCK_LENGTH = 26;
  const DEFAULT_MPG = 9;
  const SIMULATED_DIESEL_PRICE = 3.45;

  let tripState = {
    primaryPay: 1400,
    addedRevenue: 0,
    totalRevenue: 1400,

    startingSpace: 14,
    startingWeight: 6200,

    remainingSpace: 14,
    remainingWeight: 6200,

    extraMiles: 0,
    extraFuel: 0,

    returnAdded: false,
    returnPay: 740,

    roundTripMiles: 524,
    roundTripRevenue: 0
  };

  /*
   * FIND ME MONEY
   */

  const findMoneyButton = document.getElementById("findMoney");

  if (findMoneyButton) {
    findMoneyButton.addEventListener("click", function () {
      const pay = Math.max(0, getNumber("loadPay", 1400));
      const space = Math.max(0, getNumber("spaceLeft", 14));
      const weight = Math.max(0, getNumber("weightLeft", 6200));

      let addedRevenue = 0;
      let spaceUsed = 0;
      let weightUsed = 0;
      let extraMiles = 0;

      /*
       * Simulated AutoStack.
       *
       * Enough capacity:
       * Greenville partial + Spartanburg partial.
       */

      if (space >= 7 && weight >= 2450) {
        addedRevenue = 475;
        spaceUsed = 7;
        weightUsed = 2450;
        extraMiles = 30;
      } else if (space >= 4 && weight >= 1800) {
        addedRevenue = 290;
        spaceUsed = 4;
        weightUsed = 1800;
        extraMiles = 18;
      } else {
        addedRevenue = 0;
        spaceUsed = 0;
        weightUsed = 0;
        extraMiles = 0;
      }

      const remainingSpace = Math.max(0, space - spaceUsed);
      const remainingWeight = Math.max(0, weight - weightUsed);

      const extraGallons = extraMiles / DEFAULT_MPG;
      const extraFuel = extraGallons * SIMULATED_DIESEL_PRICE;

      tripState.primaryPay = pay;
      tripState.addedRevenue = addedRevenue;
      tripState.totalRevenue = pay + addedRevenue;

      tripState.startingSpace = space;
      tripState.startingWeight = weight;

      tripState.remainingSpace = remainingSpace;
      tripState.remainingWeight = remainingWeight;

      tripState.extraMiles = extraMiles;
      tripState.extraFuel = extraFuel;

      tripState.returnAdded = false;

      const extraMoney = document.getElementById("extraMoney");
      const currentTrip = document.getElementById("currentTrip");
      const newTrip = document.getElementById("newTrip");
      const drivePay = document.getElementById("drivePay");

      if (extraMoney) {
        extraMoney.textContent =
          addedRevenue > 0
            ? "+" + money(addedRevenue)
            : "$0";
      }

      if (currentTrip) {
        currentTrip.textContent = money(pay);
      }

      if (newTrip) {
        newTrip.textContent = money(pay + addedRevenue);
      }

      if (drivePay) {
        drivePay.textContent = money(pay + addedRevenue);
      }

      const afterSpace = document.getElementById("afterSpace");
      const afterWeight = document.getElementById("afterWeight");

      if (afterSpace) {
        afterSpace.textContent =
          remainingSpace + " ft remaining";
      }

      if (afterWeight) {
        afterWeight.textContent =
          remainingWeight.toLocaleString() + " lb remaining";
      }

      const capacityText = document.getElementById("capacityText");
      const payloadText = document.getElementById("payloadText");

      if (capacityText) {
        capacityText.textContent =
          space + " ft available";
      }

      if (payloadText) {
        payloadText.textContent =
          weight.toLocaleString() + " lb left";
      }

      const capacityBar = document.getElementById("capacityBar");

      if (capacityBar) {
        const occupiedBefore =
          Math.max(0, TRUCK_LENGTH - space);

        const beforePercent =
          Math.min(
            100,
            Math.max(
              0,
              (occupiedBefore / TRUCK_LENGTH) * 100
            )
          );

        capacityBar.style.width = beforePercent + "%";
      }

      const afterBar = document.getElementById("afterBar");

      if (afterBar) {
        const occupiedAfter =
          Math.max(0, TRUCK_LENGTH - remainingSpace);

        const afterPercent =
          Math.min(
            100,
            Math.max(
              0,
              (occupiedAfter / TRUCK_LENGTH) * 100
            )
          );

        afterBar.style.width = afterPercent + "%";
      }

      const extraFuelElement =
        document.getElementById("extraFuel");

      if (extraFuelElement) {
        extraFuelElement.textContent =
          money(extraFuel);
      }

      /*
       * Go automatically to MileCount's recommendation.
       */
      showScreen(1);
    });
  }

  /*
   * SEE OTHER OPTIONS
   */

  const otherOptionsButton =
    document.getElementById("otherOptions");

  if (otherOptionsButton) {
    otherOptionsButton.addEventListener(
      "click",
      function () {
        const options =
          document.getElementById("options");

        if (!options) {
          return;
        }

        const currentlyHidden =
          options.classList.contains("hidden");

        options.classList.toggle(
          "hidden",
          !currentlyHidden
        );

        otherOptionsButton.textContent =
          currentlyHidden
            ? "HIDE OTHER OPTIONS"
            : "SEE OTHER OPTIONS";
      }
    );
  }

  /*
   * ADD TO MY TRIP
   */

  const addTripButton =
    document.getElementById("addTrip");

  if (addTripButton) {
    addTripButton.addEventListener(
      "click",
      function () {
        const drivePay =
          document.getElementById("drivePay");

        if (drivePay) {
          drivePay.textContent =
            money(tripState.totalRevenue);
        }

        showScreen(2);
      }
    );
  }

  /*
   * PROTECT MY RETURN
   */

  const protectReturnButton =
    document.getElementById("protectReturn");

  if (protectReturnButton) {
    protectReturnButton.addEventListener(
      "click",
      function () {
        updateBackhaulNumbers();
        showScreen(3);
      }
    );
  }

  /*
   * BACKHAUL / ROUND-TRIP CALCULATIONS
   */

  function updateBackhaulNumbers() {
    const outboundRevenue =
      tripState.totalRevenue;

    const returnPay =
      tripState.returnPay;

    const roundTripRevenue =
      outboundRevenue + returnPay;

    tripState.roundTripRevenue =
      roundTripRevenue;

    /*
     * Simulated round-trip mileage for prototype.
     * Later this will come from the route engine.
     */

    const miles =
      tripState.roundTripMiles;

    const gallons =
      miles / DEFAULT_MPG;

    const fuel =
      gallons * SIMULATED_DIESEL_PRICE;

    const afterFuel =
      roundTripRevenue - fuel;

    const roundFuel =
      document.getElementById("roundFuel");

    const afterFuelElement =
      document.getElementById("afterFuel");

    if (roundFuel) {
      roundFuel.textContent =
        money(fuel);
    }

    if (afterFuelElement) {
      afterFuelElement.textContent =
        money(afterFuel);
    }
  }

  /*
   * GET ME HOME PAID
   */

  const getHomeButton =
    document.getElementById("getHome");

  if (getHomeButton) {
    getHomeButton.addEventListener(
      "click",
      function () {
        tripState.returnAdded = true;

        updateBackhaulNumbers();

        const homeResult =
          document.getElementById("homeResult");

        if (homeResult) {
          homeResult.classList.remove("hidden");
          homeResult.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }

        /*
         * Update Drive screen total.
         */

        const drivePay =
          document.getElementById("drivePay");

        if (drivePay) {
          drivePay.textContent =
            money(tripState.roundTripRevenue);
        }

        getHomeButton.textContent =
          "HOMEBOUND LOAD ADDED ✓";

        getHomeButton.disabled = true;
      }
    );
  }

  /*
   * VIEW UPDATED TRIP
   */

  const updatedTripButton =
    document.getElementById("updatedTrip");

  if (updatedTripButton) {
    updatedTripButton.addEventListener(
      "click",
      function () {
        const drivePay =
          document.getElementById("drivePay");

        if (drivePay) {
          drivePay.textContent =
            money(
              tripState.returnAdded
                ? tripState.roundTripRevenue
                : tripState.totalRevenue
            );
        }

        showScreen(2);
      }
    );
  }

  /*
   * INITIAL VALUES
   */

  updateBackhaulNumbers();

})();
</script>
