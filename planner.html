<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MileCount Planner</title><style>*{box-sizing:border-box}body{margin:0;background:#050a08;color:#f3f8f5;font-family:Arial,sans-serif}.app{max-width:650px;margin:auto;min-height:100vh}.head{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #20352b}.logo{font-size:28px;font-weight:900}.green{color:#18b66d}.wrap{padding:14px}.card{background:#0c1712;border:1px solid #20352b;border-radius:18px;padding:16px;margin-bottom:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#111f19;border-radius:14px;padding:14px}.stat small{display:block;color:#81948a;font-size:10px;font-weight:900}.stat b{display:block;font-size:23px;margin-top:6px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#81948a;font-size:9px;font-weight:900;padding:6px 0}.day{min-height:74px;background:#111f19;border:1px solid transparent;border-radius:11px;padding:7px;cursor:pointer;overflow:hidden}.day.has{border-color:#31bf72}.day b{font-size:14px}.tiny{font-size:8px;line-height:1.35;color:#8adbb5;margin-top:5px}.muted{color:#93a79d;font-size:12px;line-height:1.45}.row{display:flex;gap:9px}.row>*{flex:1}button,input,select{width:100%;padding:14px;border-radius:11px;font-size:15px}button{border:0;background:#18b66d;color:#fff;font-weight:900;margin-top:8px}.secondary{background:#15271f;border:1px solid #2b4438}.nav{width:auto;padding:10px 12px;background:#15271f;color:#fff;border:1px solid #2b4438;font-weight:900}label{display:block;color:#93a79d;font-size:10px;font-weight:900;margin:10px 0}input,select{display:block;margin-top:5px;background:#0a1510;color:#fff;border:1px solid #2b4438}.form{display:none}.trip{padding:12px 0;border-bottom:1px solid #20352b}.trip:last-child{border:0}.tripline{display:flex;justify-content:space-between;gap:10px}.monthhead{display:flex;align-items:center;justify-content:space-between}.arrows{display:flex;gap:6px}.arrows button{width:auto;padding:9px 14px}.notice{padding:12px;border-radius:12px;background:#111f19;color:#93a79d}@media(max-width:420px){.day{min-height:68px;padding:5px}.tiny{font-size:7px}}</style></head><body><div class="app"><div class="head"><div class="logo">MileCount<span class="green">.</span></div><select id="nav" class="nav"><option value="planner">PLANNER</option><option value="driver">DRIVER</option><option value="account">ACCOUNT</option></select></div><div class="wrap"><div class="card"><h2 style="margin:0 0 6px">Your work calendar</h2><p class="muted">Tap a date to add a trip. AutoStack updates that same trip automatically.</p><div id="who" class="muted"></div></div><div class="stats"><div class="stat"><small>MONTH REVENUE</small><b id="revenue">$0</b></div><div class="stat"><small>TRIPS</small><b id="count">0</b></div></div><div class="card" style="margin-top:14px"><div class="monthhead"><h2 id="month" style="margin:0"></h2><div class="arrows"><button id="prev" class="secondary">‹</button><button id="next" class="secondary">›</button></div></div><div id="calendar" style="margin-top:14px"></div></div><div id="detail" class="card form"><h2 id="detailRoute">Trip details</h2><div class="stats"><div class="stat"><small>EXPECTED PAY</small><b id="detailPay">$0</b></div><div class="stat"><small>AUTOSTACK ADDED</small><b id="detailAdded">$0</b></div><div class="stat"><small>SPACE OPEN</small><b id="detailSpace">0 ft</b></div><div class="stat"><small>PAYLOAD OPEN</small><b id="detailWeight">0 lb</b></div></div><p id="detailTime" class="muted"></p><button id="detailAuto">AUTOSTACK • FILL SPACE</button><button id="closeDetail" class="secondary">CLOSE</button></div><div id="form" class="card form"><h2 id="formTitle">Add trip</h2><label>DATE<input id="date" type="date"></label><div class="row"><label>PICKUP TIME<input id="pickupTime" type="time" value="08:00"></label><label>EST. END TIME<input id="endTime" type="time" value="15:00"></label></div><div class="row"><label>FROM<input id="from" value="Atlanta, GA"></label><label>TO<input id="to" value="Charlotte, NC"></label></div><div class="row"><label>LOAD PAY<input id="pay" type="number" value="1400"></label><label>SPACE USED<select id="used"><option value="0">Empty</option><option value="6">6 ft</option><option value="8">8 ft</option><option value="10">10 ft</option><option value="13" selected>13 ft / Half</option><option value="18">18 ft</option><option value="22">22 ft</option><option value="26">Full</option></select></label></div><label>WEIGHT USED<select id="weight"><option value="0">0 lb</option><option value="2000">2,000 lb</option><option value="4000">4,000 lb</option><option value="6000" selected>6,000 lb</option><option value="8000">8,000 lb</option><option value="10000">10,000 lb</option></select></label><button id="saveAuto">SAVE + AUTOSTACK</button><button id="save" class="secondary">SAVE TRIP</button><button id="cancel" class="secondary">CANCEL</button></div><div class="card"><h2>Upcoming work</h2><div id="trips" class="muted">Loading...</div></div></div></div><script src="cloud.js?v=4-planner-cloud"></script><script>
(function(){function $(id){return document.getElementById(id)}function money(n){return "$"+Math.round(Number(n)||0).toLocaleString()}function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}var cursor=new Date(),trips=[],selected=null,session=null;function total(t){return Number(t.original_pay||0)+Number(t.autostack_pay||0)+Number(t.return_pay||0)}function dayOf(t){return String(t.pickup_at||"").slice(0,10)}function openSpace(t){return Math.max(0,26-Number(t.cargo_used_ft||0))}function openWeight(t){return Math.max(0,10000-Number(t.weight_used_lb||0))}
function render(){var y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);$("month").textContent=cursor.toLocaleString(undefined,{month:"long",year:"numeric"});var mt=trips.filter(function(t){var d=new Date(t.pickup_at);return d.getFullYear()===y&&d.getMonth()===m});$("revenue").textContent=money(mt.reduce(function(s,t){return s+total(t)},0));$("count").textContent=mt.length;var h='<div class="cal">';["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(function(d){h+='<div class="dow">'+d+'</div>'});for(var z=0;z<first.getDay();z++)h+='<div></div>';for(var n=1;n<=last.getDate();n++){var day=iso(new Date(y,m,n)),t=trips.find(function(x){return dayOf(x)===day});h+='<div class="day '+(t?'has':'')+'" data-day="'+day+'"><b>'+n+'</b>';if(t)h+='<div class="tiny">'+t.origin.split(",")[0]+' → '+t.destination.split(",")[0]+'<br>'+money(total(t))+' • '+openSpace(t)+'ft open'+(Number(t.autostack_pay)>0?' • AUTOSTACK ✓':'')+'</div>';h+='</div>'}h+='</div>';$("calendar").innerHTML=h;document.querySelectorAll("[data-day]").forEach(function(x){x.onclick=function(){openDay(x.dataset.day)}});var now=iso(new Date()),up=trips.filter(function(t){return dayOf(t)>=now}).sort(function(a,b){return a.pickup_at.localeCompare(b.pickup_at)});$("trips").innerHTML=up.length?up.map(function(t){return '<div class="trip"><div class="tripline"><b>'+t.origin+' → '+t.destination+'</b><b class="green">'+money(total(t))+'</b></div><div class="muted">'+new Date(t.pickup_at).toLocaleString()+' • '+openSpace(t)+' ft open • '+openWeight(t).toLocaleString()+' lb open</div></div>'}).join(""):"No trips yet."}
function openDay(day){var t=trips.find(function(x){return dayOf(x)===day});if(t){selected=t;$("detailRoute").textContent=t.origin+" → "+t.destination;$("detailPay").textContent=money(total(t));$("detailAdded").textContent=money(Number(t.autostack_pay||0)+Number(t.return_pay||0));$("detailSpace").textContent=openSpace(t)+" ft";$("detailWeight").textContent=openWeight(t).toLocaleString()+" lb";$("detailTime").textContent=new Date(t.pickup_at).toLocaleString()+" → "+(t.delivery_at?new Date(t.delivery_at).toLocaleString():"");$("detail").style.display="block";$("detail").scrollIntoView({block:"start"});return}$("date").value=day;$("formTitle").textContent="Add trip • "+new Date(day+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});$("form").style.display="block";$("form").scrollIntoView({block:"start"})}
async function saveTrip(auto){var day=$("date").value,pickup=$("pickupTime").value,finish=$("endTime").value;if(!day)return;if(finish<=pickup){alert("End time must be after pickup time.");return}var start=day+"T"+pickup+":00",end=day+"T"+finish+":00";var conflict=trips.find(function(t){return dayOf(t)===day&&start<(t.delivery_at||"9999")&&end>t.pickup_at});if(conflict){alert("Your truck already has a planned trip during that time.");return}var t=await MileCountCloud.savePlannerTrip({title:$("from").value+" → "+$("to").value,origin:$("from").value.trim(),destination:$("to").value.trim(),pickup_at:start,delivery_at:end,expected_revenue:Number($("pay").value)||0,original_pay:Number($("pay").value)||0,autostack_pay:0,return_pay:0,cargo_used_ft:Number($("used").value)||0,weight_used_lb:Number($("weight").value)||0,vehicle_key:"vehicle1",status:"planned"});trips.push(t);$("form").style.display="none";cursor=new Date(day+"T12:00:00");render();if(auto){localStorage.setItem("mcAutoStackPlannerId",t.id);location.href="./?autostack_id="+encodeURIComponent(t.id)}}
async function boot(){session=await MileCountCloud.session();if(!session){$("who").textContent="Sign in to use your calendar.";trips=[];render();return}$("who").textContent="Signed in • "+session.user.email;trips=await MileCountCloud.plannerTrips();render()}
$("save").onclick=function(){saveTrip(false).catch(function(e){alert(e.message)})};$("saveAuto").onclick=function(){saveTrip(true).catch(function(e){alert(e.message)})};$("cancel").onclick=function(){$("form").style.display="none"};$("closeDetail").onclick=function(){$("detail").style.display="none"};$("detailAuto").onclick=function(){if(!selected)return;localStorage.setItem("mcAutoStackPlannerId",selected.id);location.href="./?autostack_id="+encodeURIComponent(selected.id)};$("prev").onclick=function(){cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()};$("next").onclick=function(){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()};$("nav").onchange=function(){if(this.value==="driver")location.href="./";else if(this.value==="account")location.href="./?open=account"};boot().catch(function(e){$("trips").textContent="Calendar error: "+e.message;render()})})();
</script></body></html>
