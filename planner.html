<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MileCount Planner</title><style>*{box-sizing:border-box}body{margin:0;background:#050a08;color:#f3f8f5;font-family:Arial,sans-serif}.app{max-width:650px;margin:auto;min-height:100vh}.head{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #20352b}.logo{font-size:28px;font-weight:900}.green{color:#18b66d}.wrap{padding:14px}.card{background:#0c1712;border:1px solid #20352b;border-radius:18px;padding:16px;margin-bottom:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#111f19;border-radius:14px;padding:14px}.stat small{display:block;color:#81948a;font-size:10px;font-weight:900}.stat b{display:block;font-size:23px;margin-top:6px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#81948a;font-size:9px;font-weight:900;padding:6px 0}.day{min-height:74px;background:#111f19;border:1px solid transparent;border-radius:11px;padding:7px;cursor:pointer;overflow:hidden}.day.has{border-color:#31bf72}.day b{font-size:14px}.tiny{font-size:8px;line-height:1.35;color:#8adbb5;margin-top:5px}.muted{color:#93a79d;font-size:12px;line-height:1.45}.row{display:flex;gap:9px}.row>*{flex:1}button,input,select{width:100%;padding:14px;border-radius:11px;font-size:15px}button{border:0;background:#18b66d;color:#fff;font-weight:900}.secondary{background:#15271f;border:1px solid #2b4438}.nav{width:auto;padding:10px 12px;background:#15271f;color:#fff;border:1px solid #2b4438;font-weight:900}label{display:block;color:#93a79d;font-size:10px;font-weight:900;margin:10px 0}input,select{display:block;margin-top:5px;background:#0a1510;color:#fff;border:1px solid #2b4438}.form{display:none}.trip{padding:12px 0;border-bottom:1px solid #20352b}.trip:last-child{border:0}.tripline{display:flex;justify-content:space-between;gap:10px}.monthhead{display:flex;align-items:center;justify-content:space-between}.arrows{display:flex;gap:6px}.arrows button{width:auto;padding:9px 14px}@media(max-width:420px){.day{min-height:68px;padding:5px}.tiny{font-size:7px}}</style></head><body><div class="app"><div class="head"><div class="logo">MileCount<span class="green">.</span></div><select id="nav" class="nav"><option value="planner">PLANNER</option><option value="driver">DRIVER</option><option value="account">ACCOUNT</option></select></div><div class="wrap"><div class="card"><h2 style="margin:0 0 6px">Your work calendar</h2><p class="muted">Tap any date to add a trip. Then use AutoStack to fill the remaining space.</p></div><div class="stats"><div class="stat"><small>MONTH REVENUE</small><b id="revenue">$0</b></div><div class="stat"><small>TRIPS</small><b id="count">0</b></div></div><div class="card" style="margin-top:14px"><div class="monthhead"><h2 id="month" style="margin:0"></h2><div class="arrows"><button id="prev" class="secondary">‹</button><button id="next" class="secondary">›</button></div></div><div id="calendar" style="margin-top:14px"></div></div><div id="form" class="card form"><h2 id="formTitle">Add trip</h2><label>DATE<input id="date" type="date"></label><div class="row"><label>PICKUP TIME<input id="pickupTime" type="time" value="08:00"></label><label>EST. END TIME<input id="endTime" type="time" value="15:00"></label></div><div class="row"><label>FROM<input id="from" value="Atlanta, GA"></label><label>TO<input id="to" value="Charlotte, NC"></label></div><div class="row"><label>LOAD PAY<input id="pay" type="number" value="1400"></label><label>SPACE USED<select id="used"><option value="0">Empty</option><option value="6">6 ft</option><option value="8">8 ft</option><option value="10">10 ft</option><option value="13" selected>13 ft / Half</option><option value="18">18 ft</option><option value="22">22 ft</option><option value="26">Full</option></select></label></div><label>VEHICLE<select id="tripVehicle"><option value="vehicle1">Primary Vehicle</option></select></label><label>WEIGHT USED<select id="weight"><option value="0">0 lb</option><option value="2000">2,000 lb</option><option value="4000">4,000 lb</option><option value="6000" selected>6,000 lb</option><option value="8000">8,000 lb</option><option value="10000">10,000 lb</option></select></label><button id="saveAuto">SAVE + AUTOSTACK</button><button id="save" class="secondary">SAVE TRIP</button><button id="cancel" class="secondary">CANCEL</button></div><div class="card"><h2>Upcoming work</h2><div id="trips" class="muted">No trips yet.</div></div></div></div><script>
const $=id=>document.getElementById(id),money=n=>"$"+Math.round(Number(n)||0).toLocaleString();let cursor=new Date(),trips=[];try{const x=JSON.parse(localStorage.getItem("mcOriginalTrips")||"[]");if(Array.isArray(x))trips=x}catch(e){}trips=trips.filter(t=>t&&t.date&&t.from&&t.to);const saveStore=()=>localStorage.setItem("mcOriginalTrips",JSON.stringify(trips));function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function total(t){return Number(t.pay||0)+Number(t.addedPay||0)+Number(t.returnPay||0)}function render(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);$("month").textContent=cursor.toLocaleString(undefined,{month:"long",year:"numeric"});const mt=trips.filter(t=>{const d=new Date(t.date+"T12:00:00");return d.getFullYear()===y&&d.getMonth()===m});$("revenue").textContent=money(mt.reduce((s,t)=>s+total(t),0));$("count").textContent=mt.length;let h='<div class="cal">'+["SUN","MON","TUE","WED","THU","FRI","SAT"].map(d=>'<div class="dow">'+d+'</div>').join("");for(let z=0;z<first.getDay();z++)h+="<div></div>";for(let n=1;n<=last.getDate();n++){const day=iso(new Date(y,m,n)),t=trips.find(x=>x.date===day);h+='<div class="day '+(t?"has":"")+'" data-day="'+day+'"><b>'+n+'</b>'+(t?'<div class="tiny">'+String(t.from).split(",")[0]+' → '+String(t.to).split(",")[0]+'<br>'+money(total(t))+' • '+Math.max(0,26-Number(t.used||0))+'ft open'+(t.addedPay?' • AUTOSTACK ✓':'')+'</div>':'')+'</div>'}h+="</div>";$("calendar").innerHTML=h;document.querySelectorAll("[data-day]").forEach(x=>x.onclick=()=>openDay(x.dataset.day));const now=iso(new Date()),up=trips.filter(t=>t.date>=now).sort((a,b)=>a.date.localeCompare(b.date));$("trips").innerHTML=up.length?up.map(t=>'<div class="trip"><div class="tripline"><b>'+t.from+' → '+t.to+'</b><b class="green">'+money(total(t))+'</b></div><div class="muted">'+t.date+' • '+(t.pickupTime||"")+"–"+(t.endTime||"")+" • '+Math.max(0,26-Number(t.used||0))+' ft open • '+Math.max(0,10000-Number(t.weight||0)).toLocaleString()+' lb open</div>'+(t.addedPay?'<div class="tiny">AUTOSTACK ✓ +'+money(t.addedPay)+(t.returnPay?' • RETURN +'+money(t.returnPay):'')+'</div>':'')+'</div>').join(""):"No trips yet."}function openDay(day){const t=trips.find(x=>x.date===day);if(t){localStorage.setItem("mcAutoStackTripDate",day);location.href="./?autostack="+encodeURIComponent(day);return}$("date").value=day;$("formTitle").textContent="Add trip • "+new Date(day+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});$("form").style.display="block";$("form").scrollIntoView({behavior:"smooth",block:"start"})}function saveTrip(auto){const day=$("date").value;if(!day)return;const pickup=$("pickupTime").value||"08:00",finish=$("endTime").value||"15:00",vehicle=$("tripVehicle").value||"vehicle1";if(finish<=pickup){alert("End time must be after pickup time.");return}const conflict=trips.find(x=>x.date===day&&(x.vehicle||"vehicle1")===vehicle&&pickup<(x.endTime||"23:59")&&finish>(x.pickupTime||"00:00"));if(conflict){alert("That vehicle is already booked "+(conflict.pickupTime||"")+"–"+(conflict.endTime||"")+" for "+conflict.from+" → "+conflict.to+".");return}const t={id:Date.now(),date:day,pickupTime:pickup,endTime:finish,vehicle,from:$("from").value.trim(),to:$("to").value.trim(),pay:Number($("pay").value)||0,used:Number($("used").value)||0,weight:Number($("weight").value)||0,status:"booked"};trips.push(t);saveStore();$("form").style.display="none";cursor=new Date(day+"T12:00:00");render();if(auto){localStorage.setItem("mcAutoStackTripDate",day);location.href="./?autostack="+encodeURIComponent(day)}}$("save").onclick=()=>saveTrip(false);$("saveAuto").onclick=()=>saveTrip(true);$("cancel").onclick=()=>$("form").style.display="none";$("prev").onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()};$("next").onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()};$("nav").onchange=()=>{if($("nav").value==="driver")location.href="./";if($("nav").value==="account")location.href="./?open=account"};render();
</script></body></html>
