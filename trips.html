<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Trips • MileCount</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050a08;color:#f3f8f5;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px}.logo{font-size:27px;font-weight:900;color:#f3f8f5;text-decoration:none}.green{color:#18a568}.card{background:#0c1712;border:1px solid #20352b;border-radius:17px;padding:16px;margin-bottom:12px}.muted{color:#93a79d;font-size:12px}.trip>summary{cursor:pointer}.trip>summary:focus-visible{outline:2px solid #31bf72;outline-offset:6px}.trip[open]>summary{margin-bottom:12px}.route{font-size:18px;font-weight:900}.pay{font-size:24px;font-weight:900;color:#31bf72}.top{display:flex;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#111f19;padding:10px;border-radius:10px}.metric small{display:block;color:#789184;font-size:8px;font-weight:900}.metric b{display:block;margin-top:4px}.back{padding:10px 12px;border-radius:10px;background:#15271f;color:#fff;text-decoration:none;font-weight:900}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="app"><div class="head"><a class="logo" href="./">MileCount<span class="green">.</span></a><a class="back" href="./">HOME</a></div>
<div class="card"><h2 style="margin:0 0 5px">My Trips</h2><div class="muted">Your saved trip history. Tap any trip to review its details.</div></div><div id="list"><div class="card muted">Loading trips…</div></div></div>
<script src="cloud.js?v=50-admin-ui"></script><script src="trips-view.js?v=20261003-audit1"></script><script>
(async()=>{const list=document.getElementById("list");try{const s=await MileCountCloud.session();if(!s){list.innerHTML='<div class="card">Sign in on MileCount to see your saved trips.</div>';return}const trips=await MileCountCloud.trips();list.innerHTML=trips.length?trips.map(MileCountTrips.render).join(""):'<div class="card muted">No saved trips yet.</div>';}catch(e){list.textContent='Could not load trips: '+e.message;}})();
</script></body></html>
